<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Baño | HITO Studio</title>

    <meta name="description" content="Recorrido 360° del proyecto.">
    <meta name="theme-color" content="#ffffff">

    <link rel="stylesheet" href="app.css">

</head>

<body>

    <!-- ========================= -->
    <!-- Pantalla de carga -->
    <!-- ========================= -->

    <div id="loader">

        <div class="loader-content">

            <div class="spinner"></div>

            <h2>HITO Studio</h2>

            <p>Cargando panorama...</p>

        </div>

    </div>



    <!-- ========================= -->
    <!-- Viewer -->
    <!-- ========================= -->

    <main id="viewer-container">

        <div id="pano"></div>

    </main>



    <!-- ========================= -->
    <!-- Barra superior -->
    <!-- ========================= -->

    <header class="topbar">

        <div class="project">

            <h1>Baño Principal</h1>

            <span>Proyecto Residencial</span>

        </div>

        <div class="actions">

            <button id="volverBtn">

                Volver

            </button>

            <button id="btnAutorotate">

                Girar

            </button>

            <button id="btnFullscreen">

                Pantalla Completa

            </button>

        </div>

    </header>



    <!-- ========================= -->
    <!-- Información -->
    <!-- ========================= -->

    <aside class="info-panel">

        <h3>Información</h3>

        <p>

            Espacio diseñado para priorizar la iluminación natural,
            materiales pétreos y una atmósfera cálida.

        </p>

    </aside>



    <!-- ========================= -->
    <!-- Indicador -->
    <!-- ========================= -->

    <div class="scroll-indicator">

        Arrastrá para explorar

    </div>



    <!-- ========================= -->
    <!-- Hotspots -->
    <!-- ========================= -->

<!--     <div id="hotspots" style="display:none;">

        <div id="info-material" class="hotspot">

            <div class="hotspot-dot"></div>

        </div>

    </div>

-->

    <!-- ========================= -->
    <!-- Scripts -->
    <!-- ========================= -->

    <script src="marzipano.js"></script>

    <script src="app.js"></script>

</body>

</html>
