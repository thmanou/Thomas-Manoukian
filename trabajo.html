<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Departamento | Thomas Manoukian</title>

    <meta name="description" content="Recorrido 360° del proyecto.">
    <meta name="theme-color" content="#ffffff">

    <link rel="stylesheet" href="app.css">

</head>

<body>
    

    <!-- ========================= -->
    <!-- Intro -->
    <!-- ========================= -->

    <section id="intro">
        <model-viewer
            id="modelo"
            src="modelo2.glb"
            camera-controls
            camera-orbit="0deg 50deg auto"
            max-camera-orbit="auto 90deg auto"
            auto-rotate
            auto-rotate-delay="0"
            rotation-per-second="12deg"
            shadow-intensity="1"
            exposure="0.8"
            touch-action="pan-y">
        </model-viewer>

        <button id="enterButton">
            Ingresar al recorrido
        </button>
    </section>

    <!-- ========================= -->
    <!-- Loader -->
    <!-- ========================= -->

    <div id="loader">

        <div class="loader-content">

            <div class="spinner"></div>

            <h2>Thomas Manoukian</h2>

            <p>Cargando recorrido...</p>

        </div>

    </div>

    <!-- ========================= -->
    <!-- Viewer -->
    <!-- ========================= -->

    <main id="viewer-container" style="display:none;">

        <div id="pano"></div>

        <div id="navigation-indicator">
            <div class="navigation-arrow">↑</div>
            <span class="navigation-label">Ir</span>
        </div>
    </main>

    <!-- ========================= -->
    <!-- Barra superior -->
    <!-- ========================= -->

    <header class="topbar">

        <button id="menuToggle" class="menu-toggle">
            ☰
        </button>

        <div class="actions">
            <div class="project">

                <h1>Departamento Residencial</h1>

                <span>Unidad tipo A | 4 ambientes</span>

            </div>

            <button id="volverBtn">

                Volver

            </button>

            <button id="btnAutorotate">

                Girar

            </button>

            <button id="btnFullscreen">

                Pantalla Completa

            </button>

        </div>

    </header>

    <!-- ========================= -->
    <!-- Información -->
    <!-- ========================= -->
<!--
    <aside class="info-panel">

        <h3>Información</h3>

        <p>

            Espacio diseñado para priorizar la iluminación natural,
            materiales pétreos y una atmósfera cálida.

        </p>

    </aside>
-->


    <!-- ========================= -->
    <!-- Indicador -->
    <!-- ========================= -->

    <div class="scroll-indicator">

        Arrastrá para explorar

    </div>

    <!-- ========================= -->
    <!-- Hotspots -->
    <!-- ========================= -->

     <div id="hotspots" style="display:none;">

        <div id="info-material" class="hotspot">

            <div class="hotspot-dot"></div>

        </div>

    </div>



    <!-- ========================= -->
    <!-- Scripts -->
    <!-- ========================= -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <script src="marzipano.js"></script>
    <script src="app.js"></script>

    

</body>

</html>
