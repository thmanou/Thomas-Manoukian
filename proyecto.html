<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Proyecto | Clínica Urbana</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="plantas.css">
</head>
<body>

<!-- NAV -->
<nav>
    <div>
        <a href="index.html">Home</a>
        <a href="index.html#proyectos">Proyecto</a>
        <a href="#galeria">Galeria</a>
    </div>
</nav>

<!-- ===== CONTENEDOR GENERAL PROYECTO ===== -->
<section class="proyecto-hero">

    <div class="hero-imagen">
        <img id="imagen-principal" alt="Clínica Urbana">
    </div>

    <div class="hero-overlay"></div>

    <div class="hero-content-proyecto">
        <h1 id="titulo"></h1>
        <p id="subtitulo"></p>
    </div>

</section>

<!-- ================= 01 PRESENTACIÓN ================= -->
<section class="project-presentation">

    <div class="presentation-number">01</div>

    <div class="presentation-layout">

        <div class="presentation-text">
            <p class="eyebrow">PRESENTACIÓN</p>

            <h1 id="projectTitle">Proyecto</h1>
            <p class="project-subtitle" id="presentationSubtitle"></p>

            <div class="project-description" id="presentationText"></div>

            <div class="project-data">
                <div>
                    <span>AÑO</span>
                    <strong id="projectYear">—</strong>
                </div>

                <div>
                    <span>UBICACIÓN</span>
                    <strong id="projectLocation">—</strong>
                </div>

                <div>
                    <span>PROGRAMA</span>
                    <strong id="projectProgram">—</strong>
                </div>

                <div>
                    <span>SUPERFICIE</span>
                    <strong id="projectArea">—</strong>
                </div>
            </div>
        </div>

        <div class="presentation-media">

            <figure class="presentation-image-wrap">
                <img id="presentationImage" alt="">
            </figure>

            <figure class="presentation-gif-wrap" id="presentationGifWrap">
                <img id="presentationGif" alt="">
            </figure>

        </div>

    </div>
</section>


<!-- ================= 02 PLANTAS ================= -->
<section class="project-plans" id="plantas">

    <div class="section-heading">
        <div class="section-number">02</div>
        <div>
            <p class="eyebrow">DOCUMENTACIÓN</p>
            <h2>Plantas</h2>
        </div>
    </div>

    <div class="plans-layout">

        <aside class="plans-sidebar">

            <div class="floor-tabs" id="floorTabs"></div>

            <div class="plan-information">
                <span id="planCounter">01 / 01</span>
                <h3 id="floorLabel">—</h3>
                <p id="floorDescription"></p>
                <small id="floorScale"></small>
            </div>

        </aside>

        <div class="floor-viewer" id="floorViewer">

            <button class="plan-arrow plan-prev" id="planPrev" aria-label="Planta anterior">
                ←
            </button>

            <div class="floor-image-wrap">
                <img id="floorPlan" alt="">
            </div>

            <button class="plan-arrow plan-next" id="planNext" aria-label="Planta siguiente">
                →
            </button>

        </div>

    </div>
</section>


<!-- ================= 03 CORTE ================= -->
<section class="project-cut" id="corte">

    <div class="section-heading cut-heading">
        <div class="section-number">03</div>
        <div>
            <p class="eyebrow">DOCUMENTACIÓN</p>
            <h2>Corte</h2>
        </div>

        <div class="cut-controls">
            <button id="zoomOut" aria-label="Alejar">−</button>
            <button id="zoomReset" aria-label="Restablecer zoom">100%</button>
            <button id="zoomIn" aria-label="Acercar">+</button>
        </div>
    </div>

    <div class="cut-viewer" id="cutViewer">

        <div class="cut-canvas" id="cutCanvas">
            <img id="cutImage" alt="">
            <div class="cut-hotspots" id="cutHotspots"></div>
        </div>

        <div class="cut-instruction">
            <span>ARRASTRAR</span>
            <span>SCROLL PARA ZOOM</span>
        </div>

    </div>

    <div class="cut-description" id="cutDescription"></div>

</section>

<!-- ===== GALERÍA DE RENDERS ===== -->

<section class="proyecto-galeria" id="galeria"></section>

<!-- LIGHTBOX -->

<div id="lightbox" class="lightbox">
    <div class="lightbox-overlay"></div>

    <button class="lightbox-close">&times;</button>

    <div class="lightbox-content">
        <button class="lightbox-nav prev">&#10094;</button>
        <img id="lightbox-img" src="" alt="">
        <button class="lightbox-nav next">&#10095;</button>
    </div>

    <div class="lightbox-counter">
        <span id="current">1</span> / <span id="total">1</span>
    </div>
</div>

<!-- FOOTER -->
<footer>
    © 2026 Thomas Manoukian
</footer>

<script src="script.js" defer></script>

</body>
</html>
